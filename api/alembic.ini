# Alembic configuration. Alembic manages database schema changes ("migrations").
# See docs/database-and-migrations.md for how to use it.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Readable, date-sortable migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# The database URL is NOT set here. migrations/env.py reads it from the app
# settings (POSTGRES_* environment variables), so there is one source of truth.

[post_write_hooks]
# Format newly generated migration files with ruff.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
