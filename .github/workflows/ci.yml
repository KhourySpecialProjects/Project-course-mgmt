# Continuous integration: runs on every pull request and every push to main.
# A pull request should only be merged when all of these jobs are green.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coursemgmt
          POSTGRES_PASSWORD: coursemgmt
          POSTGRES_DB: coursemgmt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coursemgmt"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      TEST_POSTGRES_DB: coursemgmt_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t course-mgmt-api ./api
      - run: docker build --target prod -t course-mgmt-web ./web
